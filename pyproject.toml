[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "On-prem-capable agentic RAG platform: FastAPI, LangGraph, MCP, pgvector, vLLM, Langfuse, evals in CI, Kubernetes"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Viachaslau Spetsyian", email = "slava@spetsyian.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.56.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "xai-sdk>=1.21.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-psycopg>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "qdrant-client>=1.15",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.165.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_rag_platform", "tests"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["xai_sdk.*"]
# xai-sdk ships types; keep this override only if a submodule is untyped.
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "pgvector",
    "pgvector.*",
]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: needs a live Postgres with pgvector; skipped unless DATABASE_URL is set",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # qdrant-client embedded mode: payload indexes / HNSW params are no-ops there.
    "ignore:Payload indexes have no effect:UserWarning",
    "ignore:Local mode performs exact:UserWarning",
]
